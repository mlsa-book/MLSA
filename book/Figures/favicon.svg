<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- MLSA favicon — distilled from Figures/cover-new.svg
       Stopwatch with a gear-toothed bezel: timing + machinery.
       Palette: navy #2A3444, gold #C8A800, cyan #4ABCD8, parchment #F7F3E8 -->

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#2A3444"/>

  <!-- Crown / start-stop button, seated on the bezel in the tooth gap at 12 o'clock -->
  <rect x="238" y="54" width="36" height="48" rx="11" fill="#5A8AB0"/>
  <rect x="220" y="36" width="72" height="30" rx="13" fill="#7FA8C8"/>

  <!-- 8 bold gear teeth, offset 22.5deg so gaps sit at 12/3/6/9 o'clock -->
  <g transform="translate(256,288) rotate(22.5)" fill="#C8A800">
    <rect x="-28" y="-218" width="56" height="56" rx="10"/>
    <rect x="-28" y="-218" width="56" height="56" rx="10" transform="rotate(45)"/>
    <rect x="-28" y="-218" width="56" height="56" rx="10" transform="rotate(90)"/>
    <rect x="-28" y="-218" width="56" height="56" rx="10" transform="rotate(135)"/>
    <rect x="-28" y="-218" width="56" height="56" rx="10" transform="rotate(180)"/>
    <rect x="-28" y="-218" width="56" height="56" rx="10" transform="rotate(225)"/>
    <rect x="-28" y="-218" width="56" height="56" rx="10" transform="rotate(270)"/>
    <rect x="-28" y="-218" width="56" height="56" rx="10" transform="rotate(315)"/>
  </g>

  <!-- Bezel ring + face -->
  <circle cx="256" cy="288" r="168" fill="#1A2434"/>
  <circle cx="256" cy="288" r="168" fill="none" stroke="#C8A800" stroke-width="38"/>

  <!-- Hour ticks at 12, 3, 6 and 9 -->
  <g transform="translate(256,288)" stroke="#CBD5E1" stroke-width="16" stroke-linecap="round" opacity="0.9">
    <line x1="0" y1="-138" x2="0" y2="-110"/>
    <line x1="0" y1="-138" x2="0" y2="-110" transform="rotate(90)"/>
    <line x1="0" y1="-138" x2="0" y2="-110" transform="rotate(180)"/>
    <line x1="0" y1="-138" x2="0" y2="-110" transform="rotate(270)"/>
  </g>

  <!-- Three hands: gold / parchment / cyan, as on the cover -->
  <g transform="translate(256,288)">
    <rect x="-16" y="-108" width="32" height="108" rx="16" fill="#C8A800" transform="rotate(105)"/>
    <rect x="-16" y="-108" width="32" height="108" rx="16" fill="#F7F3E8" transform="rotate(20)"/>
    <rect x="-16" y="-108" width="32" height="108" rx="16" fill="#4ABCD8" transform="rotate(235)"/>
  </g>

  <!-- Center cap -->
  <circle cx="256" cy="288" r="29" fill="#C8A800"/>
  <circle cx="256" cy="288" r="12" fill="#F7F3E8"/>
</svg>
